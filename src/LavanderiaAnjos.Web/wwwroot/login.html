<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Lavanderia Anjos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">LA</div>
      <div>
        <p class="eyebrow">Sistema interno</p>
        <h1 id="login-title">Lavanderia Anjos</h1>
        <p class="muted">Acesse o cadastro de clientes.</p>
      </div>
      <form id="login-form" novalidate>
        <label for="login">Login</label>
        <input id="login" name="login" autocomplete="username" maxlength="100" required autofocus>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="field-message form-message" role="alert"></p>
        <button class="button primary wide" type="submit">Entrar</button>
      </form>
    </section>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
